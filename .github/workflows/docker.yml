name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "test-env", "feat/**"]
  schedule:
    - cron: "0 2 * * 0" # weekly
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check . --output-format=github || true
      - run: ruff format --check . || true

  test:
    name: Tests + Golden Eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: Run unit tests (if any)
        run: pytest -q || echo "no tests yet — ok"
      - name: Golden eval dry-run (no DB, just syntax check)
        run: python -m py_compile eval/run_golden.py && echo "golden runner syntax ok"

  build:
    name: Build Docker (v4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push, no secrets required)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.v4
          push: false
          tags: local/second-brain-kb:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional: push only when GHCR_TOKEN is set and on main
  push:
    name: Push to GHCR (main only)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && secrets.GHCR_TOKEN != ''
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.v4
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
