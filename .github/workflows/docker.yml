name: ROBEN AI Console Docker Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "test-env", "feat/**"]
  schedule:
    # Weekly Docker build to keep image up-to-date
    cron: "0 2 * * 0"

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.export_tag.outputs.image_tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: ${{ secrets.GHCR_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.v4
          push: ${{ (secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '') || secrets.GHCR_TOKEN != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' && format('{0}/second-brain-kb:latest', secrets.DOCKERHUB_USERNAME) || '' }}
            ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' && format('{0}/second-brain-kb:{1}', secrets.DOCKERHUB_USERNAME, github.sha) || '' }}
            ${{ secrets.GHCR_TOKEN != '' && format('ghcr.io/{0}/second-brain-kb:latest', github.repository) || '' }}
            ${{ secrets.GHCR_TOKEN != '' && format('ghcr.io/{0}/second-brain-kb:{1}', github.repository, github.sha) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEON_DSN=${{ secrets.NEON_DSN }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            OLLAMA_EMBED_URL=${{ secrets.OLLAMA_EMBED_URL }}
            EMBED_MODEL=${{ secrets.EMBED_MODEL }}
            PADDLE_STRIPE_ENV=${{ secrets.PADDLE_STRIPE_ENV }}

      - name: Export Image Info
        id: export_tag
        if: always()
        run: |
          TAG="${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/second-brain-kb:latest', secrets.DOCKERHUB_USERNAME) || 'local/second-brain-kb:latest' }}"
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV
          echo "image_tag=${TAG}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy Docker Image
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        if: ${{ secrets.GHCR_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Pull and Deploy to Production
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
          echo "🚀 Deployed ghcr.io/${{ github.repository }}:${{ github.sha }} to production"
          echo "✅ Docker CI/CD Pipeline Complete"
          echo "📋 Image: ghcr.io/${{ github.repository }}:${{ github.sha }}"
