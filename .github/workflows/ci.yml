name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install ruff pytest

      - name: Lint with Ruff
        run: ruff check .

      - name: Reject shell=True in production code
        run: |
          echo "Checking for shell=True in production Python files..."
          ! git grep -n 'shell=True' -- '*.py' ':!tests/**' ':!v4-extract/**'
          echo "No shell=True found in production code."

      - name: Reject os.system in production code
        run: |
          echo "Checking for os.system in production Python files..."
          ! git grep -n 'os\.system(' -- '*.py' ':!tests/**' ':!v4-extract/**'
          echo "No os.system found in production code."

      - name: Reject eval/exec in production code
        run: |
          echo "Checking for eval/exec in production Python files..."
          ! git grep -n -E '(^|[^a-zA-Z])(eval|exec)\(' -- '*.py' ':!tests/**' ':!v4-extract/**'
          echo "No eval/exec found in production code."

      - name: Run Tests
        run: python -m pytest tests/ -v

      - name: Run Benchmark Gates
        run: |
          echo "Running performance benchmarks..."
          timeout 60 python -m pytest tests/test_benchmarks.py -v --tb=short
          echo "Benchmarks passed within time budget."

  node-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js Environment (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ai-dashboard/package-lock.json

      - name: Install Dependencies (ai-dashboard)
        working-directory: ai-dashboard
        run: npm ci

      - name: Verify TypeScript Compilation (ai-dashboard)
        working-directory: ai-dashboard
        run: npm run lint

      - name: Test Project Build (ai-dashboard)
        working-directory: ai-dashboard
        run: npm run build