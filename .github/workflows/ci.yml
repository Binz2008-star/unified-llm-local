name: CI/CD Pipeline

on:
  push:
    branches: [master, main, feat/*, fix/*]
  pull_request:
    branches: [master, main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Lint & Format ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  # ── Python Tests ───────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  # ── Node.js (ai-dashboard) ─────────────────────────────────────
  node-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ai-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: ai-dashboard
        run: npm ci

      - name: Lint
        working-directory: ai-dashboard
        run: npm run lint

      - name: Build
        working-directory: ai-dashboard
        run: npm run build

  # ── Security Scan ──────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install bandit

      - name: Bandit security scan
        run: bandit -r . -ll -f json --skip B101,B311 --exclude ./.venv,./node_modules,./ai-dashboard

  # ── Docker Build ───────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.v4
          push: false
          tags: local/second-brain-kb:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
