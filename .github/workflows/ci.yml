name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install ruff pytest

      - name: Lint with Ruff
        run: ruff check .

      - name: Run Tests
        run: python -m pytest tests/ -v

  node-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ai-dashboard/package-lock.json

      - name: Install Dependencies (ai-dashboard)
        working-directory: ai-dashboard
        run: npm ci

      - name: Verify TypeScript Compilation (ai-dashboard)
        working-directory: ai-dashboard
        run: npm run lint

      - name: Test Project Build (ai-dashboard)
        working-directory: ai-dashboard
        run: npm run build