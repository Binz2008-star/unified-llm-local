<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Second Brain v4</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'SF Mono', monospace; background: #0a0a0a; color: #e0e0e0; display: flex; height: 100vh; }
  .sidebar { width: 260px; background: #111; border-right: 1px solid #222; padding: 20px; display: flex; flex-direction: column; }
  .logo { font-size: 18px; font-weight: bold; margin-bottom: 20px; }
  .project { padding: 8px 12px; border-radius: 6px; cursor: pointer; margin: 4px 0; }
  .project.active { background: #1a1a1a; border: 1px solid #333; }
  .project:hover { background: #1a1a1a; }
  .main { flex:1; display: flex; flex-direction: column; }
  .topbar { padding: 12px 20px; border-bottom: 1px solid #222; display: flex; gap: 12px; align-items: center; }
  .search-box { flex:1; background: #111; border: 1px solid #222; border-radius: 8px; padding: 10px 14px; color: white; outline: none; }
  .search-box:focus { border-color: #444; }
  .content { flex:1; overflow-y: auto; padding: 20px; display: flex; gap: 20px; }
  .results { flex:1; }
  .chat { width: 400px; background: #111; border-left: 1px solid #222; display: flex; flex-direction: column; }
  .chunk { background: #111; border: 1px solid #222; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .chunk-meta { font-size: 11px; color: #666; margin-bottom: 8px; }
  .chunk-content { font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
  .chat-messages { flex:1; overflow-y: auto; padding: 16px; }
  .msg { margin-bottom: 12px; padding: 10px; border-radius: 8px; font-size: 13px; }
  .msg.user { background: #1a1a1a; }
  .msg.assistant { background: #111; border: 1px solid #222; }
  .chat-input { display: flex; padding: 12px; border-top: 1px solid #222; gap: 8px; }
  .chat-input input { flex:1; background: #0a0a0a; border: 1px solid #222; border-radius: 6px; padding: 8px 12px; color: white; outline: none; }
  button { background: #222; border: 1px solid #333; color: white; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
  button:hover { background: #2a2a2a; }
  .status { font-size: 11px; color: #666; margin-top: auto; }
  .agent-stream { background: #111; border: 1px solid #222; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .agent-phase { padding: 8px 12px; margin: 8px 0; border-radius: 6px; font-size: 13px; }
  .agent-phase.started { background: #1a3a2a; border-left: 3px solid #4ade80; }
  .agent-phase.completed { background: #1a2a3a; border-left: 3px solid #60a5fa; }
  .agent-phase.warning { background: #3a2a1a; border-left: 3px solid #fbbf24; }
  .agent-phase.error { background: #3a1a1a; border-left: 3px solid #f87171; }
  .agent-phase .phase-name { font-weight: bold; color: #a5f3fc; }
  .agent-phase .phase-message { color: #9ca3af; margin-top: 4px; }
  .agent-phase .phase-data { font-size: 11px; color: #6b7280; margin-top: 4px; white-space: pre-wrap; }
  .progress-bar { height: 4px; background: #222; border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: #4ade80; transition: width 0.3s ease; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="logo">🧠 Second Brain v4</div>
  <div id="projects"></div>
  <div class="status" id="status">Loading...</div>
  <div id="telemetry" style="margin-top: 20px; font-size: 0.75rem; color: #888;"></div>
</div>
<div class="main">
  <div class="topbar">
    <input class="search-box" id="searchInput" placeholder="Search brain... (e.g. auth middleware, clip selector)" onkeydown="if(event.key==='Enter') doSearch()">
    <button onclick="doSearch()">Search</button>
    <button onclick="doAgent()">Agent</button>
    <button onclick="loadMemory()">Memory</button>
  </div>
  <div class="content">
    <div class="results" id="results">
      <div style="color:#666; margin-top: 40px; text-align:center;">Search to see code chunks<br><br>Try: "how is auth handled" or "clip selector logic"</div>
    </div>
    <div style="width:340px; background:#0d0d0d; border-left:1px solid #222; padding:12px; overflow-y:auto;" id="memPanel">
      <div style="font-size:12px; color:#888; margin-bottom:8px;">LONG-TERM MEMORY <button style="font-size:11px; padding:2px 8px;" onclick="loadMemory()">↻</button></div>
      <div id="memList" style="color:#666; font-size:12px;">Click "Memory" to load stored facts/lessons.</div>
    </div>
    <div class="chat" id="chatPanel">
      <div class="chat-messages" id="chatMessages">
        <div class="msg assistant">Hi! I'm your second brain with full repo memory. Ask me anything about your code.</div>
      </div>
      <div class="chat-input">
        <input id="chatInput" placeholder="Ask brain..." onkeydown="if(event.key==='Enter') doChat()">
        <button onclick="doChat()">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
let currentProject = null;
let eventSource = null;

async function loadStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    document.getElementById('status').innerHTML = `📊 ${data.chunks || 0} chunks<br>📁 ${Object.keys(data.projects || {}).length} projects`;
    
    const projDiv = document.getElementById('projects');
    projDiv.innerHTML = '';
    for (const [id, count] of Object.entries(data.projects || {})) {
      const div = document.createElement('div');
      div.className = 'project' + (id === currentProject ? ' active' : '');
      div.textContent = `${id} (${count})`;
      div.onclick = () => { currentProject = id; loadStatus(); };
      projDiv.appendChild(div);
    }
  } catch(e) {
    document.getElementById('status').textContent = 'API offline';
  }
}

async function loadTelemetry() {
  try {
    const res = await fetch('/api/system');
    const data = await res.json();
    const telemetryDiv = document.getElementById('telemetry');
    if (telemetryDiv && data.cpu) {
      telemetryDiv.innerHTML = `
        <div style="font-size: 0.8rem; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 10px;">
          <div style="color: var(--cyan); font-weight: bold; margin-bottom: 4px;">📊 SYSTEM TELEMETRY</div>
          <div>CPU: <span style="color: #00ff88;">${data.cpu.total_percent}%</span> (${data.cpu.core_count} cores)</div>
          <div>Memory: <span style="color: #00ff88;">${Math.round(data.memory.used_bytes / 1024 / 1024 / 1024 * 10) / 10} GB / ${Math.round(data.memory.total_bytes / 1024 / 1024 / 1024 * 10) / 10} GB</span> (${data.memory.percent}%)</div>
          <div>Disk: <span style="color: #ffaa00;">${Math.round(data.disk.used_bytes / 1024 / 1024 / 1024 * 10) / 10} GB / ${Math.round(data.disk.total_bytes / 1024 / 1024 / 1024 * 10) / 10} GB</span> (${data.disk.percent.toFixed(1)}%)</div>
        </div>
      `;
    }
  } catch(e) {
    console.warn('Telemetry fetch error:', e);
  }
}

async function doSearch() {
  const q = document.getElementById('searchInput').value;
  if (!q) return;
  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = '🔍 Searching...';
  
  try {
    const res = await fetch('/api/search', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({query: q, top_k: 8})
    });
    const data = await res.json();
    
    if (!data.results || data.results.length === 0) {
      resultsDiv.innerHTML = '<div style="color:#666">No results. Indexing may still be in progress.</div>';
      return;
    }
    
    resultsDiv.innerHTML = `<div style="margin-bottom:12px; color:#666;">Found ${data.results.length} chunks for "${q}"</div>` +
      data.results.map(r => `
        <div class="chunk">
          <div class="chunk-meta">[${r.project}/${r.file}] score=${(r.score||0).toFixed(3)}</div>
          <div class="chunk-content">${escapeHtml(r.content)}</div>
        </div>
      `).join('');
  } catch(e) {
    resultsDiv.innerHTML = `<div style="color:#f55">Error: ${e.message}</div>`;
  }
}

async function doChat() {
  const input = document.getElementById('chatInput');
  const q = input.value;
  if (!q) return;
  input.value = '';
  
  const messagesDiv = document.getElementById('chatMessages');
  messagesDiv.innerHTML += `<div class="msg user">${escapeHtml(q)}</div>`;
  messagesDiv.innerHTML += `<div class="msg assistant" id="temp">Thinking...</div>`;
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
  
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({query: q, top_k: 6})
    });
    const data = await res.json();
    
    document.getElementById('temp').remove();
    messagesDiv.innerHTML += `<div class="msg assistant">${escapeHtml(data.answer)}</div>`;
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    
    if (data.context_used) {
      document.getElementById('results').innerHTML = `<div style="color:#666">Used ${data.context_used} chunks for chat</div>`;
    }
  } catch(e) {
    document.getElementById('temp').textContent = `Error: ${e.message}`;
  }
}

async function doAgent() {
  const q = document.getElementById('searchInput').value || prompt('Agent task:');
  if (!q) return;
  
  if (!confirm(`Run multi-agent task: "${q}"? This can create/edit files.`)) return;
  
  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = '<div class="agent-stream" id="agentStream"></div>';
  const streamDiv = document.getElementById('agentStream');
  
  if (eventSource) {
    eventSource.close();
  }
  
  eventSource = new EventSource(`/api/agent/stream?task=${encodeURIComponent(q)}`);
  
  eventSource.onmessage = function(event) {
    try {
      const data = JSON.parse(event.data);
      handleAgentEvent(data, streamDiv);
    } catch(e) {
      console.error('Failed to parse SSE event:', e);
    }
  };
  
  eventSource.onerror = function(err) {
    streamDiv.innerHTML += '<div class="agent-phase error"><span class="phase-name">❌ Error</span><div class="phase-message">Connection lost</div></div>';
    eventSource.close();
  };
}

function handleAgentEvent(data, streamDiv) {
  switch(data.type) {
    case 'start':
      streamDiv.innerHTML = `<div class="agent-phase started"><span class="phase-name">🚀 Started</span><div class="phase-message">Session: ${data.session_id.slice(0,8)}</div></div>`;
      break;
    case 'phase':
      const statusClass = data.status === 'started' ? 'started' : data.status === 'completed' ? 'completed' : 'warning';
      const phaseIcon = data.phase === 'researcher' ? '🔍' : data.phase === 'architect' ? '📐' : data.phase === 'editor' ? '✏️' : data.phase === 'tester' ? '🧪' : data.phase === 'memory' ? '🧠' : '⚙️';
      let html = `<div class="agent-phase ${statusClass}"><span class="phase-name">${phaseIcon} ${data.phase.charAt(0).toUpperCase() + data.phase.slice(1)}</span>`;
      html += `<div class="phase-message">${data.message}</div>`;
      if (data.data && Object.keys(data.data).length > 0) {
        const preview = JSON.stringify(data.data).slice(0, 500);
        html += `<div class="phase-data">${escapeHtml(preview)}</div>`;
      }
      html += '</div>';
      streamDiv.innerHTML += html;
      streamDiv.scrollTop = streamDiv.scrollHeight;
      break;
    case 'warning':
      streamDiv.innerHTML += `<div class="agent-phase warning"><span class="phase-name">⚠️ Warning</span><div class="phase-message">${escapeHtml(data.message)}</div></div>`;
      streamDiv.scrollTop = streamDiv.scrollHeight;
      break;
    case 'done':
      streamDiv.innerHTML += `<div class="agent-phase completed"><span class="phase-name">✅ Done</span><div class="phase-message">${escapeHtml(data.message)}</div></div>`;
      streamDiv.scrollTop = streamDiv.scrollHeight;
      if (eventSource) {
        eventSource.close();
      }
      break;
    case 'complete':
      streamDiv.innerHTML += `<div class="agent-phase completed"><span class="phase-name">✅ Complete</span><div class="phase-message">${escapeHtml(data.message)}</div></div>`;
      streamDiv.scrollTop = streamDiv.scrollHeight;
      if (eventSource) {
        eventSource.close();
      }
      break;
    case 'error':
      streamDiv.innerHTML += `<div class="agent-phase error"><span class="phase-name">❌ Error</span><div class="phase-message">${escapeHtml(data.message)}</div></div>`;
      streamDiv.scrollTop = streamDiv.scrollHeight;
      if (eventSource) {
        eventSource.close();
      }
      break;
  }
}

function escapeHtml(s) {
  return s.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');
}

async function loadMemory() {
  const list = document.getElementById('memList');
  list.innerHTML = 'Loading memory...';
  try {
    const res = await fetch('/api/memory?limit=50');
    const data = await res.json();
    const mems = data.memories || [];
    if (mems.length === 0) {
      list.innerHTML = '<div style="color:#888">No memories stored yet.</div>';
      return;
    }
    list.innerHTML = mems.map(m => `
      <div style="background:#111; border:1px solid #222; border-radius:6px; padding:8px; margin-bottom:8px;">
        <div style="font-size:10px; color:#666;">[${m.type}] ${(m.project_id||'')} · ${(m.created_at||'').slice(0,16)}</div>
        <div style="font-size:12px; white-space:pre-wrap; margin-top:4px;">${escapeHtml(m.content)}</div>
      </div>
    `).join('');
  } catch(e) {
    list.innerHTML = `<div style="color:#f55">Error: ${e.message}</div>`;
  }
}

loadStatus();
loadTelemetry();
setInterval(loadStatus, 10000);
setInterval(loadTelemetry, 10000);
</script>
</body>
</html>
