# Override: host Ollama + containerized DB (dev default)
# Usage: docker compose -f docker-compose.v4.yml -f docker-compose.override.yml up
services:
  second-brain-v4:
    environment:
      - OLLAMA_EMBED_URL=http://host.docker.internal:11434/api/embed
      - OLLAMA_CHAT_URL=http://host.docker.internal:11434/api/chat
      - LOCAL_DSN=postgresql://postgres:password@db:5432/second_brain
      - DATABASE_URL=postgresql://postgres:password@db:5432/second_brain

  db:
    ports: ["5432:5432"]
