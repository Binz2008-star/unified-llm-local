<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Code It - Intelligence Console / ROBEN AI OS Dashboard" />
    <meta name="author" content="Second Brain KB Team" />
    
    <title>Code It - Intelligence Console</title>
    
    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: IBM Plex Mono, Cairo, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Cairo:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <style>
      :root {
        --bg: #141413;
        --bg-secondary: #1a1a1d;
        --fg: #e8e8e8;
        --muted: #737373;
        --accent: #d97757;
        --accent-hover: #e88064;
        --card: #1e1e22;
        --border: #2a2a30;
        --success: #22c55e;
        --warning: #f59e0b;
        --error: #ef4444;
      }
      
      * {
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--fg);
        margin: 0;
        min-height: 100vh;
      }
      
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
        color: var(--fg);
      }
      
      code, kbd, samp {
        font-family: 'IBM Plex Mono', monospace;
      }
      
      /* RTL support for Arabic */
      [dir="rtl"] {
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      }
      
      /* Arabic text direction */
      .arabic-text {
        direction: rtl;
        arabic-numbers: auto;
      }
      
      .english-text {
        direction: ltr;
      }
      
      /* Scrollbar styling */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-secondary);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
      }
      
      /* Focus rings */
      :focus-visible {
        outline: 2px var(--accent) solid;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body class="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
